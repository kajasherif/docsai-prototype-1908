/* ----------------------------------------------------------------
   0. Deterministic PRNG so every reload shows identical numbers
------------------------------------------------------------------ */
function mulberry32(seed) {
  return function () {
    seed |= 0; seed = (seed + 0x6D2B79F5) | 0;
    let t = Math.imul(seed ^ (seed >>> 15), 1 | seed);
    t = (t + Math.imul(t ^ (t >>> 7), 61 | t)) ^ t;
    return ((t ^ (t >>> 14)) >>> 0) / 4294967296;
  };
}
const rnd = mulberry32(20260819);
const pick = (arr) => arr[Math.floor(rnd() * arr.length)];
const between = (a, b) => a + Math.floor(rnd() * (b - a + 1));

/* ----------------------------------------------------------------

------------------------------------------------------------------ */

/* ---- Runs: generated deterministically, then everything derives from here ---- */
function buildRuns() {
  const runs = [];
  const statuses = ['COMPLETED','COMPLETED','COMPLETED','COMPLETED','COMPLETED','COMPLETED','COMPLETED',
                    'FAILED','FAILED','PENDING_REVIEW','RUNNING'];
  const activeAgents = AGENTS.filter(a => a.status !== 'archived' && a.status !== 'inactive');
  for (let i = 0; i < 48; i++) {
    const agent = activeAgents[Math.floor(rnd() * activeAgents.length)];
    let status = statuses[Math.floor(rnd() * statuses.length)];
    if (!agent.hitl && status === 'PENDING_REVIEW') status = 'COMPLETED';
    const mode = rnd() < 0.18 ? 'TEST' : 'LIVE';
    const minsAgo = i * between(11, 47) + between(0, 20);
    const started = new Date(NOW.getTime() - minsAgo * 60000);
    const durationSec = between(9, 96) + rnd();
    const pages = between(1, 9);
    const inTok = between(2400, 21000);
    const outTok = between(300, 3600);
    const credits = +((inTok / 1e6 * 15) + (outTok / 1e6 * 60) + pages * 1.0).toFixed(2);
    const files = FILES_BY_AGENT[agent.id] || ['document.pdf'];
    const nFiles = agent.id === 'agt_fongs_3way' ? 3 : (rnd() < 0.25 ? 2 : 1);
    runs.push({
      runId: 'run_' + (900000 + i * 137 + between(1, 99)).toString(16) + (i % 7) + 'c',
      agentId: agent.id, agentName: agent.display, agentSlug: agent.name,
      files: files.slice(0, nFiles),
      startedAt: started,
      completedAt: status === 'RUNNING' || status === 'PENDING_REVIEW' ? null : new Date(started.getTime() + durationSec * 1000),
      durationSec: status === 'RUNNING' ? null : +durationSec.toFixed(1),
      status, mode,
      progress: status === 'RUNNING' ? between(35, 88) : (status === 'PENDING_REVIEW' ? 96 : 100),
      remarks: status === 'FAILED' ? pick(REMARKS_FAIL)
             : status === 'PENDING_REVIEW' ? pick(REMARKS_REVIEW)
             : status === 'RUNNING' ? 'Execution in progress — step 6 of ' + agent.steps + '.'
             : pick(REMARKS_OK),
      pages, inTok, outTok, credits,
      confidence: status === 'FAILED' ? null : +(0.68 + rnd() * 0.31).toFixed(2),
      triggeredBy: agent.trigger === 'connector' ? 'SharePoint Connector'
                 : agent.trigger === 'schedule' ? 'Scheduler'
                 : pick(['arun.kumar@inextlabs.com','priya.n@inextlabs.com','wei.lim@inextlabs.com']),
    });
  }
  return runs.sort((a, b) => b.startedAt - a.startedAt);
}

function buildAudit() {
  const rows = [];
  for (let i = 0; i < 34; i++) {
    const [action, label, actorType] = AUDIT_ACTIONS[Math.floor(rnd() * AUDIT_ACTIONS.length)];
    const run = RUNS[Math.floor(rnd() * RUNS.length)];
    rows.push({
      ts: new Date(NOW.getTime() - (i * between(7, 39) + between(1, 15)) * 60000),
      actorType,
      actor: actorType === 'system' ? 'docsai-engine' : actorType === 'api' ? 'svc-integration' : pick(TEAM.slice(0,4)).email,
      action, label,
      resource: action.startsWith('AGENT_') || action.startsWith('RUN_') || action.startsWith('FILE_') ? run.agentSlug : pick(['role_manager','meiling.t@inextlabs.com','platform-default']),
      status: action.includes('FAILED') ? 'failed' : 'success',
      corr: 'c-' + (0x1a2b3c + i * 7717).toString(16),
    });
  }
  return rows.sort((a, b) => b.ts - a.ts);
}

/* ---- 90-day series, derived so charts and KPIs agree ---- */
function buildSeries() {
  const days = [];
  for (let i = 89; i >= 0; i--) {
    const d = new Date(NOW.getTime() - i * 86400000);
    const dow = d.getDay();
    const base = dow === 0 || dow === 6 ? between(18, 46) : between(72, 168);
    const failed = Math.round(base * (0.03 + rnd() * 0.05));
    const review = Math.round(base * (0.05 + rnd() * 0.07));
    days.push({ date: d, total: base, failed, review, completed: base - failed - review });
  }
  return days;
}
const SERIES = buildSeries();

/* ---- Derived platform stats: every screen reads these ---- */
const STATS = (() => {
  const last30 = SERIES.slice(-30);
  const total = last30.reduce((s, d) => s + d.total, 0);
  const failed = last30.reduce((s, d) => s + d.failed, 0);
  const review = last30.reduce((s, d) => s + d.review, 0);
  // straight-through = finished with zero human touch; succeeded = everything that ultimately
  // produced an output, which includes the reviewed runs a human then approved.
  const straightThrough = total - failed - review;
  const reviewApproved = Math.round(review * 0.88);       // the rest were rejected
  const succeeded = straightThrough + reviewApproved;
  const pages = Math.round(total * 3.4);
  const credits = Math.round(total * 4.6);
  return {
    totalAgents: AGENTS.length,
    activeAgents: AGENTS.filter(a => a.status === 'published').length,
    total30: total, completed30: succeeded, failed30: failed, review30: review,
    successRate: +(succeeded / total * 100).toFixed(1),
    stpRate: +(straightThrough / total * 100).toFixed(1),
    hitlRate: +(review / total * 100).toFixed(1),
    runningNow: RUNS.filter(r => r.status === 'RUNNING').length,
    pendingReview: REVIEWS.length,
    pages30: pages, credits30: credits, spend30: +(credits * 0.01).toFixed(2),
    avgDuration: +(RUNS.filter(r => r.durationSec).reduce((s, r) => s + r.durationSec, 0) / RUNS.filter(r => r.durationSec).length).toFixed(1),
    creditLimit: 25000, pagesLimit: 15000, agentLimit: 25, userLimit: 10, connectorLimit: 10,
  };
})();

const money = (n) => '$' + Number(n).toLocaleString('en-US', { minimumFractionDigits: 2, maximumFractionDigits: 2 });
const sgd = (n) => 'SGD ' + Number(n).toLocaleString('en-US', { minimumFractionDigits: 2, maximumFractionDigits: 2 });
const num = (n) => Number(n).toLocaleString('en-US');

function fmtDateTime(d) {
  if (!d) return '—';
  return d.toLocaleDateString('en-GB', { day:'2-digit', month:'short' }) + ', ' +
         d.toLocaleTimeString('en-US', { hour:'2-digit', minute:'2-digit' });
}
function fmtDate(d) {
  if (!d) return '—';
  const dd = typeof d === 'string' ? new Date(d) : d;
  return dd.toLocaleDateString('en-GB', { day:'2-digit', month:'short', year:'numeric' });
}
function ago(d) {
  const mins = Math.round((NOW - d) / 60000);
  if (mins < 1) return 'just now';
  if (mins < 60) return mins + ' min ago';
  const h = Math.round(mins / 60);
  if (h < 24) return h + ' hr' + (h > 1 ? 's' : '') + ' ago';
  const days = Math.round(h / 24);
  return days + ' day' + (days > 1 ? 's' : '') + ' ago';
}
function dur(sec) {
  if (sec == null) return '—';
  if (sec < 60) return sec.toFixed(1) + 's';
  return Math.floor(sec / 60) + 'm ' + Math.round(sec % 60) + 's';
}

    info:['info','bg-gray-800'], brand:['sparkles','bg-gradient-to-r from-[#f05742] to-[#ff6b58]'],

}

/* ---- Modal ----
   Every open replaces #modal-root with a clean clone. Without this, the click
   listeners each modal attaches would stack up across opens and fire N times. */
function resetNode(sel) {
  const old = $(sel);
  const fresh = old.cloneNode(false);
  old.replaceWith(fresh);
  return fresh;
}
function mountOverlay(html) {
  const root = resetNode('#modal-root');
  root.innerHTML = html;
  lucide.createIcons({ nodes: [root] });
  root.querySelector('[data-modal-backdrop]').addEventListener('mousedown', (e) => {
    if (e.target.hasAttribute('data-modal-backdrop')) closeModal();
  });
  return root;
}
function openModal(html, opts = {}) {
  mountOverlay(`<div class="fixed inset-0 z-[200] flex items-center justify-center p-4 bg-black/50 backdrop-blur-sm fade-in" data-modal-backdrop>
    <div class="pop-in ${opts.width || 'max-w-lg w-full'}" data-modal-panel>${html}</div>
  </div>`);
}
function closeModal() { resetNode('#modal-root'); }
function openDrawer(html) {
  mountOverlay(`<div class="fixed inset-0 z-[200] bg-black/40 backdrop-blur-[2px] fade-in" data-modal-backdrop>
    <div class="absolute right-0 top-0 h-full w-full max-w-[680px] bg-white shadow-2xl slide-in-right overflow-y-auto">${html}</div>
  </div>`);
}
document.addEventListener('keydown', (e) => {
  if (e.key === 'Escape') closeModal();
  if ((e.metaKey || e.ctrlKey) && e.key.toLowerCase() === 'k') { e.preventDefault(); openPalette(); }
});

/* ---- YAML syntax highlighter ---- */
function yamlHi(src) {
  return esc(src)
    .replace(/^(\s*)(#.*)$/gm, '$1<span class="yaml-cmt">$2</span>')
    .replace(/^(\s*-?\s*)([a-zA-Z_][\w.\-]*)(:)/gm, '$1<span class="yaml-key">$2</span>$3')
    .replace(/(\$\{[^}]+\})/g, '<span class="yaml-var">$1</span>')
    .replace(/: (true|false|null)\b/g, ': <span class="yaml-bool">$1</span>')
    .replace(/: (-?\d+(?:\.\d+)?)\b/g, ': <span class="yaml-num">$1</span>')
    .replace(/: (&quot;[^&]*&quot;|&#39;[^&]*&#39;)/g, ': <span class="yaml-str">$1</span>');
}

  const shell = $('#app-shell');

  if (base === '/login') {
    shell.classList.add('hidden');
    document.body.classList.remove('overflow-hidden');

    let host = $('#login-host');
    if (!host) { host = document.createElement('div'); host.id = 'login-host'; document.body.appendChild(host); }
    host.innerHTML = (SCREENS['/login'] || (() => placeholder('Login')))();
    lucide.createIcons({ nodes: [host] });
    return;
  }
  const host = $('#login-host'); if (host) host.remove();
  document.body.classList.remove('overflow-auto');
  document.body.classList.add('overflow-hidden');
  shell.classList.remove('hidden');

  const fn = SCREENS[base] || (() => placeholder(TITLES[base] || 'Not found'));
  const html = fn(route);
  // Replace #screen with a clean clone so the per-route click handlers that
  // AFTER[...] attaches don't accumulate across navigations and double-fire.
  const screen = resetNode('#screen');
  screen.innerHTML = html;
  screen.scrollTop = 0;
  renderSidebar(base);
  renderBreadcrumb(base);
  lucide.createIcons();
  if (typeof window.__afterRender === 'function') window.__afterRender(base, route);
}

/* Global click delegation for lightweight actions */
document.addEventListener('click', (e) => {
  const el = e.target.closest('[data-action]');
  if (!el) return;
  const act = el.getAttribute('data-action');
  if (act === 'open-palette') { openPalette(); }
  else if (act === 'goto-review') { location.hash = '#/review'; }
  else if (act === 'close-modal') { closeModal(); }
  else if (act === 'toast') { toast(el.getAttribute('data-msg') || 'Done', el.getAttribute('data-tone') || 'success'); }
  else if (act === 'nav') { location.hash = '#' + el.getAttribute('data-route'); }
});

/* ================================================================
   RUN DETAIL
   ================================================================ */
function stepsForRun(run) {
  const agent = AGENTS.find(a => a.id === run.agentId);
  const trace = (STEP_TRACE[agent.useCase] || STEP_TRACE['data-extraction']).map(s => ({ ...s }));
  const hitlIdx = trace.findIndex(s => s.type === 'human_review');

  // strip the review gate for agents without HITL
  const steps = agent.hitl ? trace : trace.filter(s => s.type !== 'human_review');
  const total = steps.length;
  let cut = total;
  if (run.status === 'FAILED') cut = Math.max(3, Math.round(total * 0.55));
  if (run.status === 'RUNNING') cut = Math.max(2, Math.round(total * (run.progress / 100)));
  if (run.status === 'PENDING_REVIEW') cut = steps.findIndex(s => s.type === 'human_review');

  const seedR = mulberry32(parseInt(run.runId.replace(/\D/g, '').slice(0, 8) || '7', 10));
  return steps.map((s, i) => {
    let status = 'COMPLETED';
    if (i < cut) status = 'COMPLETED';
    else if (i === cut) status = run.status === 'FAILED' ? 'FAILED' : run.status === 'PENDING_REVIEW' ? 'PENDING_REVIEW' : 'RUNNING';
    else status = run.status === 'COMPLETED' ? 'COMPLETED' : 'PENDING';
    // condition steps skip one branch
    if (s.type === 'condition' && status === 'COMPLETED' && seedR() < 0.4) status = 'COMPLETED';
    const secs = +(0.4 + seedR() * (s.type.includes('ocr') || s.type.includes('convert_text') ? 14 : s.type.includes('llm') ? 9 : 1.8)).toFixed(1);
    const retries = status === 'FAILED' ? 2 : (seedR() < 0.12 ? 1 : 0);
    return { ...s, status, secs: status === 'PENDING' ? null : secs, retries,
      errorCode: status === 'FAILED'
        ? (s.type.includes('ocr') || s.type.includes('convert_text') ? 'OCR_FAILED'
           : s.type.includes('llm') ? 'MODEL_UNAVAILABLE'
           : s.type === 'call_api' ? 'API_ERROR' : 'STEP_FAILED')
        : null };
  });
}

          <div class="space-y-1">

                <span class="text-[11.5px] text-gray-400 flex-1 truncate">${esc(actor)}</span>
                <span class="text-[11px] text-gray-400 font-mono">${fmtDateTime(ts)}</span></div>`).join('')}
          </div>
          <div class="mt-4 text-[11.5px] text-gray-400 font-mono">Correlation ID: c-${run.runId.slice(4, 12)}</div>
        </div>

    </div>
  `);
};

AFTER['/run'] = () => {
  $('#screen').addEventListener('click', (e) => {
    const t = e.target.closest('[data-rd-tab]');
    if (!t) return;
    const key = t.getAttribute('data-rd-tab');
    $$('.rd-tab').forEach(b => {
      const on = b.getAttribute('data-rd-tab') === key;
      b.className = 'rd-tab px-3.5 py-2.5 text-[12.5px] font-semibold border-b-2 flex items-center gap-1.5 whitespace-nowrap transition ' +
        (on ? 'border-[#f05742] text-[#f05742]' : 'border-transparent text-gray-500 hover:text-gray-700');
    });
    $$('[data-rd-panel]').forEach(p => p.classList.toggle('hidden', p.getAttribute('data-rd-panel') !== key));
    lucide.createIcons();
  });
};

function stepIndicator(steps, idx) {
  const pct = steps.length > 1 ? (idx / (steps.length - 1)) * 100 : 0;
  return `<div class="bg-white rounded-2xl border border-gray-100 shadow-sm p-6 sm:p-7 mb-5">
    <div class="relative mb-6">
      <div class="absolute left-0 right-0 top-1/2 -translate-y-1/2 h-[3px] bg-gray-100 rounded-full"></div>
      <div class="absolute left-0 top-1/2 -translate-y-1/2 h-[3px] rounded-full bg-gradient-to-r from-[#f05742] via-[#f05742] to-[#ff6b58] transition-all duration-500" style="width:${pct}%"></div>
      <div class="relative flex justify-between">
        ${steps.map((s, i) => {
          const state = i < idx ? 'done' : i === idx ? 'active' : 'todo';
          return `<button data-builder-step="${i}" class="group relative" title="${esc(s.title)}">
            ${state === 'active' ? '<span class="absolute inset-0 rounded-full bg-[#f05742]/30 animate-ping"></span>' : ''}
            <span class="relative w-8 h-8 rounded-full flex items-center justify-center text-[11px] font-bold border-2 transition
              ${state === 'done' ? 'bg-[#f05742] border-[#f05742] text-white'
                : state === 'active' ? 'bg-white border-[#f05742] text-[#f05742] shadow-md'
                : 'bg-white border-gray-200 text-gray-300'}">
              ${state === 'done' ? '<i data-lucide="check" class="w-4 h-4"></i>' : i + 1}
            </span></button>`;
        }).join('')}
      </div>
    </div>
    <div class="flex items-end justify-between gap-4 flex-wrap">
      <div>
        <div class="text-[10px] font-bold uppercase tracking-widest text-gray-400">Step ${idx + 1} of ${steps.length}</div>
        <div class="text-[17px] font-bold mt-0.5">${esc(steps[idx].title)}</div>
        <div class="text-[12.5px] text-gray-500">${esc(steps[idx].sub)}</div>
      </div>
      <div class="flex items-center gap-1">
        ${steps.map((_, i) => `<span class="h-1 w-6 rounded-full ${i <= idx ? 'bg-[#f05742]' : 'bg-gray-200'}"></span>`).join('')}
      </div>
    </div>
  </div>`;
}

AFTER['/builder'] = () => {
  $('#screen').addEventListener('click', (e) => {
    const steps = BUILDER_STEPS[STATE.builderOp] || BUILDER_STEPS.extraction;
    const nav = e.target.closest('[data-builder-nav]');
    if (nav && !nav.disabled) {
      STATE.builderStep = nav.getAttribute('data-builder-nav') === 'next'
        ? Math.min(STATE.builderStep + 1, steps.length - 1) : Math.max(STATE.builderStep - 1, 0);
      router(); return;
    }
    const jump = e.target.closest('[data-builder-step]');
    if (jump) { STATE.builderStep = +jump.getAttribute('data-builder-step'); router(); return; }
    const op = e.target.closest('[data-builder-op]');
    if (op) { STATE.builderOp = op.getAttribute('data-builder-op'); STATE.builderStep = 0; router(); return; }
    const view = e.target.closest('[data-builder-view]');
    if (view) { STATE.builderView = view.getAttribute('data-builder-view'); router(); return; }
    if (e.target.closest('[data-builder-publish]')) {
      openModal(`<div class="bg-white rounded-2xl p-6 text-center">

function playPanelHtml() {

  const doneCount = cfgs.filter(c => c.state === 'completed' || c.state === 'failed').length;
  const active = cfgs.find(c => c.state === 'running') || cfgs[cfgs.length - 1];

    </div>

    <div class="grid grid-cols-1 sm:grid-cols-3 gap-2.5 mb-5">
      ${cfgs.map(c => {
        const tone = c.state === 'completed' ? 'border-green-200 bg-green-50' : c.state === 'failed' ? 'border-red-200 bg-red-50'

        const icon = c.state === 'completed' ? 'check-circle' : c.state === 'failed' ? 'x-circle' : c.state === 'running' ? 'loader' : 'clock';
        const col  = c.state === 'completed' ? 'text-green-600' : c.state === 'failed' ? 'text-red-500' : c.state === 'running' ? 'text-[#f05742]' : 'text-gray-400';
        return `<div class="rounded-xl border ${tone} p-3">

            <i data-lucide="${icon}" class="w-4 h-4 ${col} ${c.state === 'running' ? 'spin' : ''}"></i>

          <div class="mt-2 h-1.5 rounded-full bg-white/70 overflow-hidden">
            <div class="h-full rounded-full transition-all duration-500 ${c.state === 'failed' ? 'bg-red-400' : 'bg-gradient-to-r from-[#f05742] to-[#ff6b58]'}" style="width:${c.pct}%"></div></div>
          <div class="text-[10.5px] text-gray-500 mt-1.5">${c.state === 'completed' ? c.credits + ' cr · ' + c.seconds + 's' : c.state === 'queued' ? 'Queued' : c.pct + '%'}</div>
        </div>`;
      }).join('')}

    <div class="rounded-xl border border-gray-200 p-4">
      <div class="text-[11px] font-bold uppercase tracking-wider text-gray-400 mb-3">Pipeline — ${esc(active.name)}</div>
      <div class="space-y-3">

          const st = i < active.stage ? 'done' : i === active.stage ? (active.state === 'failed' ? 'failed' : 'running') : 'todo';
          return `<div class="flex items-center gap-3">
            <div class="w-9 h-9 rounded-full flex items-center justify-center shrink-0 border-2 transition
              ${st === 'done' ? 'bg-green-500 border-green-500' : st === 'running' ? 'bg-white border-[#f05742]'

                 class="w-4 h-4 ${st === 'done' || st === 'failed' ? 'text-white' : st === 'running' ? 'text-[#f05742] spin' : 'text-gray-300'}"></i>

          </div>`;
        }).join('')}
      </div>
      <div class="mt-4">
        <div class="flex items-center justify-between text-[11px] text-gray-500 mb-1">
          <span class="font-semibold">Overall progress</span><span class="font-mono">${Math.round(cfgs.reduce((s, c) => s + c.pct, 0) / cfgs.length)}%</span></div>

      </div>
    </div>

    ${allDone ? `
      <div class="mt-4 rounded-xl border border-green-200 bg-green-50 p-4">

          <i data-lucide="check-circle" class="w-5 h-5 text-green-600 shrink-0 mt-0.5"></i>

            <div class="text-[12px] text-green-700 mt-0.5">Run group <span class="font-mono">grp_8c41f2</span> · 3 test runs recorded, visible under Run History → Test.</div>

          <button class="btn-secondary" data-action="nav" data-route="/runs"><i data-lucide="history" class="w-4 h-4"></i>View test runs</button>
        </div>
      </div>` : ''}`;
}

function playCompareModal() {
  const rows = [
    ['section','Model Configuration'],
    ['OCR engine', c => c.ocr], ['Extraction model', c => c.extract], ['Output model', c => c.out],
    ['section','Performance'],
    ['Accuracy', c => c.accuracy + '%', 'max'], ['Processing time', c => c.seconds + 's', 'min'],
    ['Fields extracted', () => '9 of 9'],
    ['section','Cost'],
    ['Credits per run', c => c.credits, 'min'], ['Cost per run', c => money(c.credits * 0.01), 'min'],
    ['Cost at 10k docs/mo', c => money(c.credits * 0.01 * 10000), 'min'],
  ];
  const best = (label, dir) => {
    const vals = PLAY_CONFIGS.map(c => ({ id:c.id, v: label === 'Accuracy' ? c.accuracy : label === 'Processing time' ? c.seconds : c.credits }));
    return dir === 'max' ? vals.sort((a, b) => b.v - a.v)[0].id : vals.sort((a, b) => a.v - b.v)[0].id;
  };

  openModal(`<div class="bg-white rounded-2xl overflow-hidden">
    <div class="px-6 py-4 border-b border-gray-100 flex items-center justify-between">
      <div><h3 class="font-bold text-[16px]">Configuration Comparison</h3>
        <p class="text-[11.5px] text-gray-400 mt-0.5">Same document, same agent, three model stacks. Green marks the better value in each row.</p></div>
      <button class="p-2 rounded-lg hover:bg-gray-100" data-action="close-modal"><i data-lucide="x" class="w-4 h-4 text-gray-500"></i></button>
    </div>
    <div class="p-6 overflow-x-auto max-h-[65vh]">
      <table class="dt w-full" style="min-width:640px">
        <thead><tr><th class="text-left py-2 w-52"></th>
          ${PLAY_CONFIGS.map(c => `<th class="text-left py-2 px-3">
            <div class="text-[13px] font-bold text-[#252525]">${esc(c.name)}</div>
            <div class="mt-1">${pill(c.tier, c.tier === 'High' ? 'green' : c.tier === 'Budget' ? 'amber' : 'blue')}</div></th>`).join('')}
        </tr></thead>
        <tbody>
          ${rows.map(r => {
            if (r[0] === 'section') return `<tr><td colspan="4" class="pt-5 pb-1.5">
              <span class="text-[10px] font-bold uppercase tracking-widest text-gray-400">${r[1]}</span></td></tr>`;
            const [label, fn, dir] = r;
            const winner = dir ? best(label, dir) : null;
            return `<tr class="border-t border-gray-50">
              <td class="py-2.5 text-[12.5px] text-gray-500">${label}</td>
              ${PLAY_CONFIGS.map(c => `<td class="py-2.5 px-3">
                <span class="text-[12.5px] font-semibold ${winner === c.id ? 'text-green-600' : ''}">${fn(c)}
                ${winner === c.id ? '<i data-lucide="trending-up" class="w-3.5 h-3.5 inline ml-1"></i>' : ''}</span></td>`).join('')}
            </tr>`;
          }).join('')}
        </tbody>
      </table>
      <div class="mt-5 p-3.5 rounded-xl bg-blue-50 border border-blue-100 flex gap-2.5">
        <i data-lucide="lightbulb" class="w-4 h-4 text-blue-500 shrink-0 mt-0.5"></i>
        <div class="text-[12px] text-blue-800 leading-relaxed"><b>Reading this:</b> High Accuracy buys 2.3 accuracy points for 11× the cost. At 10,000 documents a month that is ${money(12.4 * 0.01 * 10000 - 4.2 * 0.01 * 10000)} extra per month. Worth it when a miss is expensive — a tax filing, a payment above your approval threshold — and rarely worth it otherwise.</div>
      </div>
    </div>
    <div class="px-6 py-4 border-t border-gray-100 flex justify-end gap-2 bg-gray-50/60">
      <button class="btn-secondary" data-action="close-modal">Close</button>

    </div></div>`, { width:'max-w-3xl w-full' });
}

        </div></div>`, { width:'max-w-lg w-full' });
      return;
    }
    const run = e.target.closest('[data-play-run]');
    if (run && !run.disabled) {
      initPlayConfigs();
      STATE.playRunning = true;
      router();
      const timer = trackTimer(setInterval(() => {
        const cfgs = STATE.playConfigs;
        if (!cfgs) { clearInterval(timer); return; }
        const active = cfgs.find(c => c.state === 'running');
        if (!active) {
          const next = cfgs.find(c => c.state === 'queued');
          if (next) { next.state = 'running'; }
          else { clearInterval(timer); STATE.playRunning = false; router(); toast('All 3 configurations completed', 'brand'); return; }
        } else {
          active.pct = Math.min(100, active.pct + between(14, 26));
          active.stage = Math.min(PLAY_STAGES.length - 1, Math.floor(active.pct / 26));
          if (active.pct >= 100) { active.state = 'completed'; active.stage = PLAY_STAGES.length; }
        }
        const panel = $('#play-panel');
        if (panel) { panel.innerHTML = playPanelHtml(); lucide.createIcons({ nodes: [panel] }); }
      }, 620));
    }
  });
};

function fieldIcon(name) {
  const n = name.toLowerCase();
  if (/date|expiry|due/.test(n)) return 'calendar';
  if (/amount|total|price|subtotal|tax|gst|value/.test(n)) return 'dollar-sign';
  if (/qty|quantity|count|number|no\.|items/.test(n)) return 'hash';
  if (/name|customer|vendor|supplier|patient|doctor|distributor/.test(n)) return 'user';
  if (/address|clinic|nationality/.test(n)) return 'map-pin';
  if (/terms|urgency|notes|procedure/.test(n)) return 'file-text';
  return 'info';
}

  ok:   { icon:'check-circle', cls:'text-green-500',  label:'Passed' },

        const rid = cf.getAttribute('data-review-reject-confirm');
        const idx = REVIEWS.findIndex(r => r.reviewId === rid);

          const run = RUNS.find(r => r.reviewId === rid);

          REVIEWS.splice(idx, 1);

        STATE.reviewSearch = '';
        closeModal(); router(); toast('Rejected — reason recorded in the audit trail', 'error');

                <td class="px-4 py-3 text-[12px] ${rv.assignee === 'Unassigned' ? 'text-gray-400 italic' : ''}">${esc(rv.assignee)}</td>

/* ================================================================
   RECONCILIATION
   ================================================================ */
const RECON_STATUS = {
  matched:    { label:'Matched',    cls:'bg-green-50 text-green-700 border-green-200', icon:'check-circle' },
  discrepant: { label:'Discrepant', cls:'bg-amber-50 text-amber-700 border-amber-200', icon:'alert-triangle' },
  review:     { label:'Needs Review', cls:'bg-orange-50 text-orange-700 border-orange-200', icon:'user-check' },
  unmatched:  { label:'Unmatched',  cls:'bg-red-50 text-red-700 border-red-200', icon:'x-circle' },
};

SCREENS['/reconciliation'] = () => {
  const recipe = RECIPES.find(r => r.id === STATE.reconRecipe) || RECIPES[0];
  const counts = RECON_ROWS.reduce((acc, r) => { acc[r.status] = (acc[r.status] || 0) + 1; return acc; }, {});
  const totalA = RECON_ROWS.filter(r => r.amtA != null).reduce((s, r) => s + r.amtA, 0);
  const totalB = RECON_ROWS.filter(r => r.amtB != null).reduce((s, r) => s + r.amtB, 0);
  const variance = +(totalA - totalB).toFixed(2);
  const autoPct = Math.round((counts.matched || 0) / RECON_ROWS.length * 100);

  if (!STATE.reconRun) {
    return page(`

        <div class="text-[13px] font-bold mb-1">1 · Choose a recipe</div>

        <div class="grid grid-cols-1 md:grid-cols-2 xl:grid-cols-3 gap-3">
          ${RECIPES.map(r => `<button data-recon-recipe="${r.id}" class="text-left p-4 rounded-xl border-2 transition ${STATE.reconRecipe === r.id ? 'border-[#f05742] bg-[#f05742]/[.05]' : 'border-gray-200 hover:border-gray-300'}">
            <div class="flex items-center gap-2 mb-1.5">${pill(esc(r.industry), 'gray')}<span class="text-[11px] text-gray-400">${esc(r.sub)}</span></div>
            <div class="text-[12.5px] font-bold leading-snug">${esc(r.a.label)} <span class="text-gray-300">↔</span> ${esc(r.b.label)}</div>
            <div class="text-[11px] text-gray-500 mt-1.5">${r.map.length} mapped fields · ± ${r.tolDays} day window</div>
          </button>`).join('')}
        </div>
      </div>

      <div class="bg-white rounded-2xl border border-gray-100 shadow-sm p-5 mb-5">
        <div class="text-[13px] font-bold mb-1">2 · Attach the document pair</div>
        <p class="text-[12px] text-gray-500 mb-3.5">Each side is parsed by the same extraction engine used everywhere else — any format, any bank, no per-source parser.</p>
        <div class="grid grid-cols-1 md:grid-cols-2 gap-4">
          ${[[recipe.a, 'A', '#f05742'], [recipe.b, 'B', '#3b82f6']].map(([doc, letter, color]) => `
            <div class="rounded-xl border-2 border-dashed p-5 text-center transition cursor-pointer hover:bg-gray-50" style="border-color:${color}55" data-action="toast" data-msg="${esc(doc.label)} attached">
              <span class="inline-flex w-8 h-8 rounded-lg items-center justify-center text-white text-[12px] font-bold mb-2" style="background:${color}">${letter}</span>
              <div class="text-[13px] font-bold">${esc(doc.label)}</div>
              <div class="text-[11.5px] text-gray-400 mt-0.5">${doc.fields.length} fields expected</div>
              <div class="mt-2.5 inline-flex items-center gap-1.5 text-[11.5px] font-semibold" style="color:${color}">
                <i data-lucide="paperclip" class="w-3.5 h-3.5"></i>Drop file or click</div>
            </div>`).join('')}
        </div>
      </div>

      <div class="bg-white rounded-2xl border border-gray-100 shadow-sm p-5">
        <div class="text-[13px] font-bold mb-1">3 · Matching rules</div>
        <p class="text-[12px] text-gray-500 mb-3.5">Applied in order. Amount and date tolerances stop settlement lag from reading as a mismatch.</p>
        <div class="overflow-x-auto rounded-xl border border-gray-200 mb-4">
          <table class="dt w-full">
            <thead class="bg-gray-50 border-b border-gray-200"><tr>
              <th class="text-left px-4 py-2.5">${esc(recipe.a.label)}</th><th class="px-2 py-2.5"></th>
              <th class="text-left px-4 py-2.5">${esc(recipe.b.label)}</th>
              <th class="text-left px-4 py-2.5">Match type</th><th class="text-left px-4 py-2.5">Tolerance</th></tr></thead>
            <tbody class="divide-y divide-gray-50">
              ${recipe.map.map(m => `<tr>
                <td class="px-4 py-2.5 font-medium">${esc(m.a)}</td>
                <td class="px-2 py-2.5 text-center text-gray-300"><i data-lucide="arrow-right" class="w-3.5 h-3.5 inline"></i></td>
                <td class="px-4 py-2.5 font-medium">${esc(m.b)}</td>
                <td class="px-4 py-2.5">${pill(esc(m.type), m.type === 'Exact' ? 'green' : m.type.startsWith('Date') ? 'blue' : m.type.startsWith('Fuzzy') ? 'purple' : 'amber')}</td>
                <td class="px-4 py-2.5 text-gray-500 font-mono text-[11.5px]">${esc(m.tol || '—')}</td></tr>`).join('')}
            </tbody></table>
        </div>
        <button class="btn-primary" data-recon-run><i data-lucide="play" class="w-4 h-4"></i>Run reconciliation</button>
      </div>
    `);
  }

  return page(`
    <div class="flex items-center gap-1.5 text-[12px] text-gray-400 mb-4">
      <button class="hover:text-[#f05742] font-medium" data-recon-back>Reconciliation</button>
      <i data-lucide="chevron-right" class="w-3 h-3"></i><span class="text-gray-600 font-medium">${esc(recipe.industry)} · ${esc(recipe.a.label)} ↔ ${esc(recipe.b.label)}</span>
    </div>

    ${pageHeader('arrow-left-right','Reconciliation Result','Run rec_8f21c4 · 18 Aug 2026 · matched with a ± ' + recipe.tolDays + ' day settlement window.',
      `<button class="btn-secondary" data-action="toast" data-msg="Exception report exported as CSV"><i data-lucide="download" class="w-4 h-4"></i>Export CSV</button>

    <div class="grid grid-cols-2 md:grid-cols-3 xl:grid-cols-6 gap-3 mb-5">
      ${[['Records read', RECON_ROWS.length, 'file-text', '#6b7280'],
         ['Auto matched', counts.matched || 0, 'check-circle', '#10b981'],
         ['Discrepant', counts.discrepant || 0, 'alert-triangle', '#f59e0b'],
         ['Needs review', counts.review || 0, 'user-check', '#f97316'],
         ['Unmatched', counts.unmatched || 0, 'x-circle', '#ef4444'],
         ['Net variance', sgd(Math.abs(variance)), 'scale', '#f05742']]
        .map(([label, val, icon, color]) => `
        <div class="bg-white rounded-xl border border-gray-100 shadow-sm p-4">
          <div class="flex items-center gap-1.5" style="color:${color}"><i data-lucide="${icon}" class="w-3.5 h-3.5"></i>
            <span class="text-[10px] font-bold uppercase tracking-wider">${label}</span></div>
          <div class="text-[20px] font-bold mt-1.5 leading-none">${val}</div></div>`).join('')}

    <div class="rounded-2xl border border-[#f05742]/20 bg-gradient-to-r from-[#f05742]/[.06] via-white to-white p-4 mb-5 flex items-center gap-5 flex-wrap">

        <div class="w-10 h-10 rounded-xl bg-gradient-to-br from-[#f05742] to-[#ff6b58] flex items-center justify-center shrink-0">
          <i data-lucide="zap" class="w-5 h-5 text-white"></i></div>
        <div><div class="text-[10px] uppercase tracking-wider font-bold text-gray-400">Auto-match rate</div>
          <div class="text-[20px] font-bold leading-tight">${autoPct}%<span class="text-[12px] font-medium text-gray-400 ml-2">${counts.matched} of ${RECON_ROWS.length} reconciled with no human touch</span></div></div>
      </div>
      <div class="h-9 w-px bg-gray-200 hidden md:block"></div>
      <div class="text-[12px] text-gray-600 flex-1 min-w-[280px] leading-relaxed">
        ${(counts.discrepant || 0) + (counts.review || 0) + (counts.unmatched || 0)} rows need a person. Without the ± ${recipe.tolDays} day window, ${RECON_ROWS.filter(r => r.status === 'matched' && r.dateA !== r.dateB).length} of the matched rows would have been reported as unmatched.
      </div>
      ${pill('<i data-lucide="calendar-clock" class="w-3 h-3"></i>± ' + recipe.tolDays + ' day tolerance', 'blue')}
    </div>

    ${card(`
      <div class="px-5 py-3.5 border-b border-gray-100 flex items-center gap-2 flex-wrap">
        <span class="text-[12.5px] font-bold mr-2">Filter</span>
        ${['All', ...Object.keys(RECON_STATUS).map(k => RECON_STATUS[k].label)].map((l, i) =>
          `<button class="px-3 py-1 rounded-full text-[11.5px] font-semibold border transition ${i === 0 ? 'bg-[#f05742] text-white border-[#f05742]' : 'bg-white border-gray-200 text-gray-600 hover:border-gray-300'}">${l}</button>`).join('')}
      </div>
      <div class="overflow-x-auto">
        <table class="dt w-full" style="min-width:1120px">
          <thead class="bg-gray-50/80 border-b border-gray-100">
            <tr>
              <th colspan="3" class="text-left px-4 py-2 border-r border-gray-200 bg-[#f05742]/[.05]">
                <span class="text-[#f05742]">A · ${esc(recipe.a.label)}</span></th>
              <th colspan="3" class="text-left px-4 py-2 border-r border-gray-200 bg-blue-50">
                <span class="text-blue-600">B · ${esc(recipe.b.label)}</span></th>
              <th colspan="3" class="text-left px-4 py-2">Result</th>
            </tr>
            <tr>
              <th class="text-left px-4 py-2.5">Txn ID</th><th class="text-left px-4 py-2.5">Date</th><th class="text-right px-4 py-2.5 border-r border-gray-200">Amount</th>
              <th class="text-left px-4 py-2.5">Reference</th><th class="text-left px-4 py-2.5">Date</th><th class="text-right px-4 py-2.5 border-r border-gray-200">Amount</th>
              <th class="text-left px-4 py-2.5 w-36">Status</th><th class="text-left px-4 py-2.5 w-20">Conf.</th><th class="text-left px-4 py-2.5">Why</th>
            </tr>
          </thead>
          <tbody class="divide-y divide-gray-50">
            ${RECON_ROWS.map(r => {
              const st = RECON_STATUS[r.status];
              const amtMismatch = r.amtA != null && r.amtB != null && Math.abs(r.amtA - r.amtB) > 0.001;
              const dateShift = r.dateA && r.dateB && r.dateA !== r.dateB;
              const missA = r.amtA == null, missB = r.amtB == null;
              return `<tr class="${r.status === 'unmatched' ? 'bg-red-50/40' : r.status === 'discrepant' ? 'bg-amber-50/40' : r.status === 'review' ? 'bg-orange-50/30' : ''}">
                <td class="px-4 py-2.5 font-mono text-[11.5px] ${missA ? 'text-gray-300' : ''}">${esc(r.id)}</td>
                <td class="px-4 py-2.5 text-[11.5px] ${missA ? 'text-gray-300' : 'text-gray-600'}">${r.dateA || '—'}</td>
                <td class="px-4 py-2.5 text-right font-mono text-[11.5px] border-r border-gray-100 ${missA ? 'text-gray-300' : amtMismatch ? 'bg-amber-100 font-bold rounded' : ''}">${r.amtA != null ? r.amtA.toFixed(2) : '—'}</td>
                <td class="px-4 py-2.5 font-mono text-[11.5px] ${missB ? 'text-gray-300' : r.status === 'review' ? 'bg-orange-100 rounded font-semibold' : ''}">${esc(r.refB || '—')}</td>
                <td class="px-4 py-2.5 text-[11.5px] ${missB ? 'text-gray-300' : dateShift ? 'text-blue-600 font-semibold' : 'text-gray-600'}">${r.dateB || '—'}</td>
                <td class="px-4 py-2.5 text-right font-mono text-[11.5px] border-r border-gray-100 ${missB ? 'text-gray-300' : amtMismatch ? 'bg-amber-100 font-bold rounded' : ''}">${r.amtB != null ? r.amtB.toFixed(2) : '—'}</td>
                <td class="px-4 py-2.5"><span class="chip border ${st.cls}"><i data-lucide="${st.icon}" class="w-3 h-3"></i>${st.label}</span></td>
                <td class="px-4 py-2.5 font-mono text-[11.5px] ${r.conf != null && r.conf < 0.85 ? 'text-orange-600 font-bold' : 'text-gray-500'}">${r.conf != null ? (r.conf * 100).toFixed(0) + '%' : '—'}</td>
                <td class="px-4 py-2.5 text-[11.5px] text-gray-600 max-w-[280px]"><div class="line-clamp-2">${esc(r.note)}</div></td>
              </tr>`;
            }).join('')}
          </tbody>
          <tfoot class="border-t-2 border-gray-100 bg-gray-50/60">
            <tr class="font-bold">
              <td colspan="2" class="px-4 py-3 text-[12px]">Totals</td>
              <td class="px-4 py-3 text-right font-mono text-[12px] border-r border-gray-200">${totalA.toFixed(2)}</td>
              <td colspan="2" class="px-4 py-3"></td>
              <td class="px-4 py-3 text-right font-mono text-[12px] border-r border-gray-200">${totalB.toFixed(2)}</td>
              <td colspan="3" class="px-4 py-3 text-[12px]">Variance <span class="font-mono text-[#f05742]">${variance >= 0 ? '+' : ''}${variance.toFixed(2)}</span></td>
            </tr>
          </tfoot>
        </table>
      </div>`)}

    <div class="mt-5 rounded-2xl border border-blue-200 bg-blue-50 p-4 flex gap-3">
      <i data-lucide="info" class="w-4 h-4 text-blue-500 shrink-0 mt-0.5"></i>
      <div class="text-[12px] text-blue-900 leading-relaxed">
        <b>Scope note.</b> This module is document-in, document-out: it reads two files, classifies every record and produces an exception report. It deliberately does not keep a running ledger, a customer master or ageing — that is an accounts-receivable application, a separate product decision.
      </div>
    </div>
  `);
};

AFTER['/settings'] = () => {
  $('#screen').addEventListener('click', (e) => {
    const t = e.target.closest('[data-settings-tab]');
    if (t) { STATE.settingsTab = t.getAttribute('data-settings-tab'); router(); return; }
    const et = e.target.closest('[data-engines-tab]');
    if (et) { STATE.enginesTab = et.getAttribute('data-engines-tab'); router(); return; }
    const sg = e.target.closest('[data-suite-toggle]');
    if (sg) {
      const s = STATE.suites.find(x => x.id === sg.getAttribute('data-suite-toggle'));
      s.enabled = !s.enabled;
      s.modules.forEach(m => { m[1] = s.enabled ? m[1] : false; });
      if (s.enabled && !s.modules.some(m => m[1])) s.modules[0][1] = true;
      router();
      toast(s.name + (s.enabled ? ' enabled' : ' disabled'), s.enabled ? 'success' : 'info');
    }
  });
};

                <div class="text-[10.5px] text-gray-400">${esc(a.label)}</div></td>
              <td class="px-4 py-2.5 font-mono text-[11px] text-gray-500 truncate max-w-[220px]">${esc(a.resource)}</td>

  `);
};

/* ================================================================

   ================================================================ */
SCREENS['/analytics'] = () => {
  const days = SERIES.slice(-STATE.analyticsRange);
  const total = days.reduce((s, d) => s + d.total, 0);
  const failed = days.reduce((s, d) => s + d.failed, 0);
  const review = days.reduce((s, d) => s + d.review, 0);
  const stp = +((total - failed - review) / total * 100).toFixed(1);

  const perAgent = AGENTS.filter(a => a.status === 'published').map(a => {
    const runs = RUNS.filter(r => r.agentId === a.id).length * 47 + between(120, 380);
    const succ = +(88 + rnd() * 11).toFixed(1);
    const conf = +(0.86 + rnd() * 0.12).toFixed(2);
    const hitl = a.hitl ? +(4 + rnd() * 14).toFixed(1) : 0;
    const cr = +(runs * (a.model === 'gpt-4o' ? 8.4 : 3.9)).toFixed(0);
    return { ...a, runs, succ, conf, hitl, cr, perRun: +(cr / runs).toFixed(2) };
  }).sort((a, b) => b.runs - a.runs);

  const kpi = (label, value, sub, icon, color, trend) => `
    <div class="bg-white rounded-2xl border border-gray-100 shadow-sm p-5">
      <div class="flex items-center justify-between">
        <div class="p-2 rounded-lg" style="background:${color}18"><i data-lucide="${icon}" class="w-4 h-4" style="color:${color}"></i></div>
        ${trend ? `<span class="text-[11px] font-bold ${trend.startsWith('+') ? 'text-green-600' : 'text-red-500'} flex items-center gap-0.5">
          <i data-lucide="${trend.startsWith('+') ? 'trending-up' : 'trending-down'}" class="w-3 h-3"></i>${trend}</span>` : ''}
      </div>
      <div class="text-[26px] font-bold mt-3 leading-none">${value}</div>
      <div class="text-[12.5px] font-semibold text-gray-700 mt-1.5">${label}</div>
      <div class="text-[11px] text-gray-400 mt-0.5">${sub}</div>
    </div>`;

  return page(`
    ${pageHeader('bar-chart-3','Analytics','How the platform is actually performing — throughput, accuracy, human load and cost, all from the same run records.',
      `<div class="flex items-center gap-1 bg-gray-100 rounded-lg p-0.5">
        ${[7,30,90].map(d => `<button data-analytics-range="${d}" class="px-3 py-1.5 rounded-md text-[12px] font-semibold transition ${STATE.analyticsRange === d ? 'bg-white shadow-sm text-[#f05742]' : 'text-gray-500 hover:text-gray-700'}">${d}d</button>`).join('')}
      </div>
      <button class="btn-secondary" data-action="toast" data-msg="Analytics exported"><i data-lucide="download" class="w-4 h-4"></i>Export</button>`)}

    <div class="grid grid-cols-1 sm:grid-cols-2 xl:grid-cols-4 gap-4 mb-5">
      ${kpi('Total runs', num(total), 'Across ' + perAgent.length + ' published agents', 'activity', '#f05742', '+12.4%')}
      ${kpi('Straight-through rate', stp + '%', 'Finished with zero human touch', 'zap', '#10b981', '+3.1%')}
      ${kpi('Human touch rate', +(review / total * 100).toFixed(1) + '%', num(review) + ' runs needed a reviewer', 'user-check', '#f59e0b', '-2.8%')}
      ${kpi('Cost per run', money(STATS.credits30 / STATS.total30 * 0.01), 'Blended across all model configs', 'coins', '#3b82f6', '-6.2%')}
    </div>

    <div class="grid grid-cols-1 xl:grid-cols-3 gap-5 mb-5">
      <div class="xl:col-span-2 bg-white rounded-2xl border border-gray-100 shadow-sm p-5">
        <h3 class="font-bold text-[15px]">Run outcomes over time</h3>
        <p class="text-[12px] text-gray-400 mb-3">Straight-through, reviewed and failed, stacked</p>
        <div class="h-[260px]"><canvas id="chart-outcomes"></canvas></div>
      </div>
      <div class="bg-white rounded-2xl border border-gray-100 shadow-sm p-5">
        <h3 class="font-bold text-[15px]">Model mix</h3>
        <p class="text-[12px] text-gray-400 mb-3">Share of runs by extraction model</p>
        <div class="h-[190px]"><canvas id="chart-models"></canvas></div>
        <div class="mt-4 space-y-1.5">
          ${[['gpt-4o-mini', 58, '#f05742'],['gpt-4o', 27, '#f59e0b'],['gemini-2.0-flash', 11, '#3b82f6'],['claude-sonnet-4', 4, '#a855f7']]
            .map(([m, pct, c]) => `<div class="flex items-center gap-2.5 text-[12px]">
              <span class="w-2.5 h-2.5 rounded-sm shrink-0" style="background:${c}"></span>
              <span class="flex-1 font-mono text-[11.5px]">${m}</span>
              <span class="font-semibold">${pct}%</span></div>`).join('')}
        </div>
      </div>
    </div>

    <div class="grid grid-cols-1 xl:grid-cols-2 gap-5 mb-5">
      <div class="bg-white rounded-2xl border border-gray-100 shadow-sm p-5">
        <h3 class="font-bold text-[15px]">Average processing time</h3>
        <p class="text-[12px] text-gray-400 mb-3">Seconds per run, end to end</p>
        <div class="h-[200px]"><canvas id="chart-duration"></canvas></div>
      </div>
      <div class="bg-white rounded-2xl border border-gray-100 shadow-sm p-5">
        <h3 class="font-bold text-[15px]">Cost per run</h3>
        <p class="text-[12px] text-gray-400 mb-3">Blended, in credits — falling as more traffic moves to smaller models</p>
        <div class="h-[200px]"><canvas id="chart-cost"></canvas></div>
      </div>
    </div>

    ${card(`
      <div class="px-5 py-4 border-b border-gray-100">
        <h3 class="font-bold text-[15px]">Agent performance</h3>
        <p class="text-[12px] text-gray-500 mt-0.5">The table you use to decide which agent to tune next</p>
      </div>
      <div class="overflow-x-auto">
        <table class="dt w-full" style="min-width:960px">
          <thead class="bg-gray-50/80 border-b border-gray-100"><tr>
            <th class="text-left px-5 py-3">Agent</th>
            <th class="text-right px-4 py-3 w-24">Runs</th>
            <th class="text-left px-4 py-3 w-40">Success rate</th>
            <th class="text-right px-4 py-3 w-28">Avg confidence</th>
            <th class="text-right px-4 py-3 w-28">HITL rate</th>
            <th class="text-right px-4 py-3 w-28">Credits</th>
            <th class="text-right px-4 py-3 w-28">Per run</th></tr></thead>
          <tbody class="divide-y divide-gray-50">
            ${perAgent.map(a => `<tr class="cursor-pointer" data-action="nav" data-route="/agents">
              <td class="px-5 py-3"><div class="font-semibold text-[12.5px]">${esc(a.display)}</div>
                <div class="text-[10.5px] text-gray-400">${esc(a.category)} · ${esc(a.model)}</div></td>
              <td class="px-4 py-3 text-right font-mono text-[12px]">${num(a.runs)}</td>
              <td class="px-4 py-3">
                <div class="flex items-center gap-2">
                  <div class="flex-1 h-1.5 rounded-full bg-gray-100 overflow-hidden">
                    <div class="h-full rounded-full ${a.succ > 95 ? 'bg-green-500' : a.succ > 90 ? 'bg-amber-500' : 'bg-red-500'}" style="width:${a.succ}%"></div></div>
                  <span class="font-mono text-[11.5px] font-semibold w-11 text-right">${a.succ}%</span></div></td>
              <td class="px-4 py-3 text-right font-mono text-[11.5px] ${a.conf < 0.9 ? 'text-amber-600 font-bold' : ''}">${a.conf}</td>
              <td class="px-4 py-3 text-right font-mono text-[11.5px] ${a.hitl > 12 ? 'text-orange-600 font-bold' : a.hitl === 0 ? 'text-gray-300' : ''}">${a.hitl ? a.hitl + '%' : '—'}</td>
              <td class="px-4 py-3 text-right font-mono text-[11.5px]">${num(a.cr)}</td>
              <td class="px-4 py-3 text-right font-mono text-[11.5px] font-semibold">${a.perRun} cr</td></tr>`).join('')}
          </tbody></table>
      </div>
      <div class="px-5 py-3.5 border-t border-gray-100 text-[11.5px] text-gray-500 leading-relaxed">
        <b>Reading this table:</b> a high HITL rate with high confidence usually means the review threshold is set too conservatively. A low confidence with a high success rate usually means the schema is asking for fields the document does not reliably carry.
      </div>`)}
  `);
};

AFTER['/analytics'] = () => {
  const days = SERIES.slice(-STATE.analyticsRange);
  const labels = days.map(d => d.date.toLocaleDateString('en-GB', { day:'2-digit', month:'short' }));

  const oc = $('#chart-outcomes');
  if (oc) CHARTS.outcomes = new Chart(oc, {
    type:'bar',
    data:{ labels, datasets:[
      { label:'Straight-through', data: days.map(d => d.completed), backgroundColor:'rgba(16,185,129,.82)', borderRadius:2, stack:'s' },
      { label:'Reviewed', data: days.map(d => d.review), backgroundColor:'rgba(245,158,11,.85)', borderRadius:2, stack:'s' },
      { label:'Failed', data: days.map(d => d.failed), backgroundColor:'rgba(239,68,68,.85)', borderRadius:2, stack:'s' },
    ]},
    options:{ ...CHART_BASE,
      plugins:{ ...CHART_BASE.plugins, legend:{ display:true, position:'bottom', labels:{ boxWidth:9, boxHeight:9, font:{size:11}, padding:14, usePointStyle:true, pointStyle:'circle' } } },
      scales:{ x:{ ...CHART_BASE.scales.x, stacked:true }, y:{ ...CHART_BASE.scales.y, stacked:true } } },
  });

  const mc = $('#chart-models');
  if (mc) CHARTS.models = new Chart(mc, {
    type:'doughnut',
    data:{ labels:['gpt-4o-mini','gpt-4o','gemini-2.0-flash','claude-sonnet-4'],
      datasets:[{ data:[58, 27, 11, 4], backgroundColor:['#f05742','#f59e0b','#3b82f6','#a855f7'], borderWidth:0, cutout:'64%' }] },
    options:{ responsive:true, maintainAspectRatio:false,
      plugins:{ legend:{ display:false }, tooltip:{ backgroundColor:'#252525', padding:10, cornerRadius:8 } } },
  });

  const dc = $('#chart-duration');
  if (dc) CHARTS.duration = new Chart(dc, {
    type:'line',
    data:{ labels, datasets:[{ data: days.map((d, i) => +(34 - i * 0.12 + Math.sin(i / 3) * 3.4).toFixed(1)),
      borderColor:'#3b82f6', borderWidth:2.4, pointRadius:0, pointHoverRadius:4, tension:.38, fill:true,
      backgroundColor:(ctx) => ctx.chart.chartArea ? brandGradient(ctx.chart.ctx, ctx.chart.chartArea, 'rgba(59,130,246,.24)', 'rgba(59,130,246,0)') : 'transparent' }] },
    options: CHART_BASE,
  });

  const cc = $('#chart-cost');
  if (cc) CHARTS.cost = new Chart(cc, {
    type:'line',
    data:{ labels, datasets:[{ data: days.map((d, i) => +(6.1 - i * 0.028 + Math.cos(i / 4) * 0.42).toFixed(2)),
      borderColor:'#f05742', borderWidth:2.4, pointRadius:0, pointHoverRadius:4, tension:.38, fill:true,
      backgroundColor:(ctx) => ctx.chart.chartArea ? brandGradient(ctx.chart.ctx, ctx.chart.chartArea) : 'transparent' }] },
    options: CHART_BASE,
  });

  $('#screen').addEventListener('click', (e) => {
    const r = e.target.closest('[data-analytics-range]');
    if (r) { STATE.analyticsRange = +r.getAttribute('data-analytics-range'); router(); }
  });
};
